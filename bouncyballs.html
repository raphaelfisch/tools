<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncy Balls</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #050810;
    --surface: #0d1221;
    --border: #1a2a4a;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --text: #c8d8f0;
    --text-dim: #4a6080;
    --glow: 0 0 20px rgba(0,212,255,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
    gap: 10px;
  }

  #logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(0.7rem, 3vw, 1.1rem);
    letter-spacing: 0.1em;
    color: var(--accent);
    text-shadow: var(--glow);
    white-space: nowrap;
  }

  #logo span { color: var(--accent2); }

  /* Volume display */
  #vol-display {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
    min-width: 0;
  }

  #vol-label {
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: none; /* hidden on mobile, dot is enough */
  }

  #vol-number {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.9rem, 3vw, 1.4rem);
    font-weight: 700;
    color: var(--accent);
    min-width: 2.5ch;
    text-align: right;
    transition: color 0.2s;
    text-shadow: var(--glow);
  }

  #vol-bar-wrap {
    width: clamp(60px, 20vw, 160px);
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  #vol-bar {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #00d4ff, #7c3aed, #ff6b35);
    transition: width 0.05s;
    position: relative;
  }

  #vol-bar::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 5px;
    background: white;
    border-radius: 3px;
    filter: blur(2px);
    opacity: 0.8;
  }

  /* Status dot */
  #status-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #1a3a1a;
    transition: background 0.3s, box-shadow 0.3s;
    flex-shrink: 0;
  }
  #status-dot.active {
    background: #00ff88;
    box-shadow: 0 0 10px #00ff88;
  }

  /* Canvas */
  #canvas { flex: 1; display: block; }

  /* Bottom bar */
  #controls {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }

  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    width: 100%;
  }

  #sliders-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .ctrl-label {
    font-size: 0.55rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(60px, 15vw, 100px);
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px; /* größer für Touch */
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    cursor: pointer;
  }

  /* Theme buttons */
  .theme-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.55rem, 2vw, 0.65rem);
    letter-spacing: 0.05em;
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  .theme-btn.active {
    border-color: var(--accent);
    color: var(--bg);
    background: var(--accent);
    box-shadow: 0 0 10px rgba(0,212,255,0.4);
  }

  /* Start button */
  #start-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.6rem, 2.5vw, 0.75rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 8px 28px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  #start-btn:hover, #start-btn:active {
    background: var(--accent);
    color: var(--bg);
    box-shadow: var(--glow);
  }
  #start-btn.running {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  #start-btn.running:hover, #start-btn.running:active {
    background: var(--accent2);
    color: var(--bg);
  }

  /* Grid overlay on canvas */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #canvas { width: 100%; height: 100%; }

  #overlay-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
  }
  #overlay-msg .big {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1rem, 5vw, 1.6rem);
    font-weight: 900;
    color: var(--accent);
    opacity: 0.15;
    letter-spacing: 0.2em;
  }
  #overlay-msg .small {
    font-size: clamp(0.6rem, 2.5vw, 0.75rem);
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  #overlay-msg.hidden { display: none; }

  /* Show vol-label on wider screens */
  @media (min-width: 480px) {
    #vol-label { display: block; }
  }
</style>
</head>
<body>

<div id="header">
  <div id="logo">BOUNCY<span>BALLS</span></div>
  <div id="vol-display">
    <div id="status-dot"></div>
    <span id="vol-label">Level</span>
    <div id="vol-bar-wrap"><div id="vol-bar"></div></div>
    <div id="vol-number">0</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="overlay-msg">
    <div class="big">BOUNCY BALLS</div>
    <div class="small">▶ MIKROFON STARTEN</div>
  </div>
</div>

<div id="controls">
  <div class="ctrl-row">
    <div class="ctrl-group">
      <span class="ctrl-label">Theme</span>
      <button class="theme-btn active" data-theme="balls">Bälle</button>
      <button class="theme-btn" data-theme="emoji">Emoji</button>
      <button class="theme-btn" data-theme="numbers">Zahlen</button>
      <button class="theme-btn" data-theme="bubbles">Bubbles</button>
    </div>
    <div id="sliders-group" class="ctrl-group">
      <span class="ctrl-label">Empfindlichkeit</span>
      <input type="range" id="sensitivity" min="1" max="10" value="5">
      <span class="ctrl-label" style="margin-left:12px">Wenig</span>
      <input type="range" id="density-slider" min="0.05" max="0.85" step="0.01" value="0.35" style="width:90px">
      <span class="ctrl-label">Voll</span>
    </div>
  </div>
  <div class="ctrl-row">
    <button id="start-btn">▶ Start</button>
  </div>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const THEMES = {
  balls: {
    name: 'balls',
    draw(ctx, b) {
      const g = ctx.createRadialGradient(
        b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.05,
        b.x, b.y, b.r
      );
      g.addColorStop(0, b.highlight);
      g.addColorStop(0.5, b.color);
      g.addColorStop(1, b.shadow);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      // shine
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
    }
  },
  emoji: {
    name: 'emoji',
    emojis: ['😀','🎉','🔥','⚡','🎵','🤩','💥','🌟','🚀','🎸'],
    _cache: {},
    getCanvas(emoji, size) {
      const key = emoji + '_' + size;
      if (this._cache[key]) return this._cache[key];
      const s = size * 2; // 2x for sharpness
      const oc = document.createElement('canvas');
      oc.width = s; oc.height = s;
      const octx = oc.getContext('2d');
      octx.font = `${s * 0.8}px serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText(emoji, s / 2, s / 2);
      this._cache[key] = oc;
      return oc;
    },
    draw(ctx, b) {
      const size = Math.round(b.r * 2);
      const oc = this.getCanvas(b.emoji, size);
      ctx.drawImage(oc, b.x - size / 2, b.y - size / 2, size, size);
    }
  },
  numbers: {
    name: 'numbers',
    _cache: {},
    getCanvas(label, color, r) {
      const key = label + color + r;
      if (this._cache[key]) return this._cache[key];
      const s = Math.round(r * 2);
      const oc = document.createElement('canvas');
      oc.width = s; oc.height = s;
      const octx = oc.getContext('2d');
      // circle background
      octx.beginPath();
      octx.arc(s/2, s/2, r - 1, 0, Math.PI * 2);
      octx.fillStyle = color + '33';
      octx.fill();
      octx.strokeStyle = color;
      octx.lineWidth = 2;
      octx.stroke();
      // number
      octx.font = `bold ${r * 0.9}px 'Orbitron', monospace`;
      octx.fillStyle = color;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText(label, s/2, s/2 + 1);
      this._cache[key] = oc;
      return oc;
    },
    draw(ctx, b) {
      const s = Math.round(b.r * 2);
      const oc = this.getCanvas(b.label, b.color, b.r);
      ctx.drawImage(oc, b.x - s/2, b.y - s/2, s, s);
    }
  },
  bubbles: {
    name: 'bubbles',
    draw(ctx, b) {
      // transparent bubble
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // inner glow
      const g = ctx.createRadialGradient(b.x, b.y, b.r * 0.4, b.x, b.y, b.r);
      g.addColorStop(0, 'rgba(255,255,255,0.0)');
      g.addColorStop(1, b.color + '22');
      ctx.fillStyle = g;
      ctx.fill();
      // specular highlight
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(b.x + b.r * 0.3, b.y + b.r * 0.3, b.r * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fill();
    }
  }
  // ← Add new themes here as objects with a draw(ctx, ball) method
};

const COLORS = [
  { color: '#00d4ff', highlight: '#80eaff', shadow: '#004466' },
  { color: '#ff6b35', highlight: '#ffb090', shadow: '#661a00' },
  { color: '#7c3aed', highlight: '#c084fc', shadow: '#2e1065' },
  { color: '#00ff88', highlight: '#80ffcc', shadow: '#004422' },
  { color: '#ffd700', highlight: '#fff3a3', shadow: '#665500' },
  { color: '#ff3b7a', highlight: '#ff9abb', shadow: '#660018' },
];

// ─── STATE ──────────────────────────────────────────────────────────────────
let balls = [];
let running = false;
let audioCtx, analyser, micStream;
let animFrame;
let currentTheme = 'balls';
let sensitivity = 5;
let ballCount = 20;
let densityRatio = 0.35; // 0..1, von wenig bis voll

function calcBallCount() {
  const avgBallArea = Math.PI * 27 * 27;
  const canvasArea = (canvas._cssWidth || canvas.width) * (canvas._cssHeight || canvas.height);
  const minCount = Math.max(3, Math.round((canvasArea * 0.04) / avgBallArea));
  const maxCount = Math.min(120, Math.round((canvasArea * 0.40) / avgBallArea));
  ballCount = Math.round(minCount + densityRatio * (maxCount - minCount));
}
let currentVolume = 0;
const NUMBERS_CHARS = '0123456789';

// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas._cssWidth  = w;
  canvas._cssHeight = h;
  calcBallCount();
}
window.addEventListener('resize', () => { resize(); rebuildBalls(); });
resize();

// ─── BALL FACTORY ───────────────────────────────────────────────────────────
function makeBall(i) {
  const ci = i % COLORS.length;
  const r = 18 + Math.random() * 18;
  const col = COLORS[ci];
  const W = canvas._cssWidth || canvas.width;
  const H = canvas._cssHeight || canvas.height;
  return {
    x: r + Math.random() * (W - 2 * r),
    y: r + Math.random() * (H * 0.5),
    r,
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 2,
    color: col.color,
    highlight: col.highlight,
    shadow: col.shadow,
    emoji: THEMES.emoji.emojis[i % THEMES.emoji.emojis.length],
    label: NUMBERS_CHARS[i % NUMBERS_CHARS.length],
    mass: r * r,
  };
}

function rebuildBalls() {
  balls = Array.from({ length: ballCount }, (_, i) => makeBall(i));
}
rebuildBalls();

// ─── PHYSICS ────────────────────────────────────────────────────────────────
const GRAVITY = 0.4;
const DAMPING = 0.72;
const BOUNCE  = 0.65;
const RESTITUTION = 0.5; // weniger elastisch = ruhiger bei hoher Dichte
const COLLISION_SUBSTEPS = 3; // mehrere Iterationen pro Frame für Stabilität

let prevVolume = 0;

function resolveCollisions() {
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    for (let j = i + 1; j < balls.length; j++) {
      const b2 = balls[j];
      const dx = b2.x - b.x, dy = b2.y - b.y;
      const distSq = dx * dx + dy * dy;
      const minD = b.r + b2.r;
      if (distSq < minD * minD && distSq > 0) {
        const dist = Math.sqrt(distSq);
        const nx = dx / dist, ny = dy / dist;
        const overlap = minD - dist;
        const m1 = b.mass, m2 = b2.mass, mSum = m1 + m2;

        // Positions trennen
        b.x  -= nx * overlap * (m2 / mSum);
        b.y  -= ny * overlap * (m2 / mSum);
        b2.x += nx * overlap * (m1 / mSum);
        b2.y += ny * overlap * (m1 / mSum);

        // Impuls nur wenn aufeinander zu
        const dvn = (b.vx - b2.vx) * nx + (b.vy - b2.vy) * ny;
        if (dvn > 0) {
          const imp = (1 + RESTITUTION) * dvn / mSum;
          b.vx  -= imp * m2 * nx;  b.vy  -= imp * m2 * ny;
          b2.vx += imp * m1 * nx;  b2.vy += imp * m1 * ny;
        }
      }
    }
  }
}

function physicsStep(vol) {
  const W = canvas._cssWidth || canvas.width;
  const H = canvas._cssHeight || canvas.height;

  const delta = Math.max(0, vol - prevVolume);
  prevVolume = vol;
  const impulse = delta * (sensitivity / 5) * 120;

  // Bewegung + Schall-Impuls + Wandcheck
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];

    if (impulse > 0.5) {
      b.vy -= impulse * (0.8 + Math.random() * 0.4);
      b.vx += (Math.random() - 0.5) * impulse * 0.25;
    }

    b.vy += GRAVITY;
    b.vx *= 0.998;
    b.x  += b.vx;
    b.y  += b.vy;

    if (b.x - b.r < 0)  { b.x = b.r;     b.vx =  Math.abs(b.vx) * BOUNCE; }
    if (b.x + b.r > W)  { b.x = W - b.r; b.vx = -Math.abs(b.vx) * BOUNCE; }
    if (b.y - b.r < 0)  { b.y = b.r;     b.vy =  Math.abs(b.vy) * BOUNCE; }
    if (b.y + b.r > H)  { b.y = H - b.r; b.vy = -Math.abs(b.vy) * DAMPING; b.vx *= 0.92; }
  }

  // Kollisionen mehrfach iterieren für Stabilität bei hoher Dichte
  for (let s = 0; s < COLLISION_SUBSTEPS; s++) resolveCollisions();
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function drawGrid() {
  const W = canvas._cssWidth || canvas.width;
  const H = canvas._cssHeight || canvas.height;
  ctx.strokeStyle = 'rgba(0,212,255,0.04)';
  ctx.lineWidth = 1;
  const step = 60;
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function render() {
  const W = canvas._cssWidth || canvas.width;
  const H = canvas._cssHeight || canvas.height;
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  const theme = THEMES[currentTheme];
  for (const b of balls) {
    ctx.save();
    theme.draw(ctx, b);
    ctx.restore();
  }
}

// ─── AUDIO ──────────────────────────────────────────────────────────────────
function getVolume() {
  if (demoMode) {
    demoT += 0.03;
    // simulate irregular noise bursts
    const base = 0.04;
    const burst = Math.max(0, Math.sin(demoT) * 0.12 + Math.sin(demoT * 2.7) * 0.07);
    return base + burst + Math.random() * 0.02;
  }
  if (!analyser) return 0;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) {
    const v = (data[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / data.length);
}

let demoMode = false;
let demoT = 0;

async function startMic() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no api');
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    document.getElementById('status-dot').classList.add('active');
    demoMode = false;
    return true;
  } catch(e) {
    // Fallback: demo mode with simulated noise
    demoMode = true;
    demoT = 0;
    const dot = document.getElementById('status-dot');
    dot.classList.add('active');
    dot.style.background = '#ffd700';
    dot.style.boxShadow = '0 0 12px #ffd700';
    document.getElementById('vol-label').textContent = 'DEMO';
    return true;
  }
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  analyser = null; micStream = null; audioCtx = null;
  document.getElementById('status-dot').classList.remove('active');
}

// ─── LOOP ────────────────────────────────────────────────────────────────────
function loop() {
  const raw = getVolume();
  // smooth
  currentVolume = currentVolume * 0.6 + raw * 0.4;

  // UI update
  const pct = Math.min(currentVolume * 300 * (sensitivity / 5), 100);
  document.getElementById('vol-bar').style.width = pct + '%';
  const num = Math.round(pct);
  const volNum = document.getElementById('vol-number');
  volNum.textContent = num;
  volNum.style.color = num > 75 ? '#ff6b35' : num > 45 ? '#ffd700' : '#00d4ff';

  physicsStep(currentVolume);
  render();
  animFrame = requestAnimationFrame(loop);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', async () => {
  if (!running) {
    const ok = await startMic();
    if (!ok) return;
    running = true;
    document.getElementById('start-btn').textContent = '⏹ Stop';
    document.getElementById('start-btn').classList.add('running');
    document.getElementById('overlay-msg').classList.add('hidden');
    loop();
  } else {
    running = false;
    cancelAnimationFrame(animFrame);
    stopMic();
    demoMode = false;
    currentVolume = 0;
    document.getElementById('vol-bar').style.width = '0%';
    document.getElementById('vol-number').textContent = '0';
    document.getElementById('vol-label').textContent = 'Level';
    const dot = document.getElementById('status-dot');
    dot.style.background = '';
    dot.style.boxShadow = '';
    document.getElementById('start-btn').textContent = '▶ Start';
    document.getElementById('start-btn').classList.remove('running');
    document.getElementById('overlay-msg').classList.remove('hidden');
    render();
  }
});

document.getElementById('sensitivity').addEventListener('input', e => {
  sensitivity = +e.target.value;
});

document.getElementById('density-slider').addEventListener('input', e => {
  densityRatio = +e.target.value;
  calcBallCount();
  rebuildBalls();
});

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTheme = btn.dataset.theme;
  });
});

// initial render
render();
</script>
</body>
</html>
