<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakerEdu Beurteilungs-Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F8F6; --surface: #FFF; --border: #E2E0DC; --border-lt: #EDEBE8;
    --text: #1A1A1A; --muted: #8A8780; --dim: #B0ADA8;
    --purple: #7C3AED; --orange: #E8590C; --green: #0F9D58; --blue: #1A73E8;
    --purple-bg: #F5F0FF; --orange-bg: #FFF4ED; --green-bg: #EDFCF2; --blue-bg: #EEF4FF;
    --r: 6px; --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; font-size: 13px; }

  .topbar { background: #2D2D2D; padding: 0 20px; display: flex; align-items: center; gap: 12px; height: 48px; flex-shrink: 0; }
  .topbar-mark { width: 24px; height: 24px; background: linear-gradient(135deg, var(--purple), var(--blue)); border-radius: 5px; display: grid; place-items: center; color: white; font-weight: 800; font-size: 12px; }
  .topbar h1 { color: #FFFFFF; font-size: 13px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
  .pill { padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 100px; cursor: pointer; border: 1px solid #666; background: #444; color: #EEE; transition: all 0.15s; font-family: var(--font); }
  .pill:hover { background: #555; color: #FFF; border-color: #888; }

  .main { display: flex; flex: 1; overflow: hidden; }
  .panel-l { width: 52%; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .panel-r { width: 48%; overflow-y: auto; padding: 16px; background: #F0EFEC; border-left: 1px solid var(--border); scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-lt); }
  .toolbar-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; background: var(--border-lt); color: var(--muted); }
  .toolbar-info { font-size: 11px; color: var(--muted); }
  .btn-reset { margin-left: auto; padding: 4px 10px; font-size: 11px; font-weight: 600; background: none; border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; color: var(--muted); font-family: var(--font); transition: all 0.15s; }
  .btn-reset:hover { border-color: #E53E3E; color: #E53E3E; }

  .settings { background: var(--surface); border: 1px solid var(--border-lt); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
  .settings-toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .settings-toggle:hover { color: var(--text); }
  .settings-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .settings-body input, .settings-body textarea { padding: 6px 10px; font-size: 12px; border: 1px solid var(--border-lt); border-radius: var(--r); outline: none; font-family: var(--font); color: var(--text); transition: border 0.15s; }
  .settings-body input:focus, .settings-body textarea:focus { border-color: var(--muted); }
  .settings-body textarea { resize: vertical; }

  .comp-accordion { background: var(--surface); border: 1px solid var(--border-lt); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s; }
  .comp-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; transition: background 0.1s; }
  .comp-header:hover { background: var(--bg); }
  .comp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .comp-label { flex: 1; }
  .comp-label strong { font-size: 12px; font-weight: 700; display: block; letter-spacing: -0.1px; }
  .comp-label small { font-size: 10px; color: var(--muted); font-weight: 500; }
  .comp-count { font-size: 10px; padding: 1px 7px; border-radius: 100px; font-weight: 700; min-width: 22px; text-align: center; }
  .comp-body { padding: 4px 12px 10px; }
  .chevron { transition: transform 0.2s; display: inline-block; font-size: 10px; color: var(--dim); }
  .chevron.open { transform: rotate(180deg); }

  .sub-header { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: var(--r); cursor: pointer; transition: background 0.1s; }
  .sub-header:hover { background: var(--bg); }
  .sub-label { font-weight: 600; font-size: 12px; flex: 1; }
  .sub-count { font-size: 10px; color: var(--dim); font-weight: 500; }
  .sub-indicators { padding-left: 30px; padding-top: 2px; padding-bottom: 4px; }
  .ind-label { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; font-size: 11.5px; color: #444; cursor: pointer; line-height: 1.45; }
  .ind-label input { margin-top: 2px; width: 14px; height: 14px; flex-shrink: 0; }

  .right-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .right-header span { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .btn-pdf { padding: 6px 14px; font-size: 12px; font-weight: 700; background: var(--text); color: white; border: none; border-radius: var(--r); cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: var(--font); transition: opacity 0.15s; }
  .btn-pdf:hover { opacity: 0.85; }
  .btn-pdf:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-pdf svg { width: 13px; height: 13px; }
  .preview-empty { text-align: center; color: var(--dim); font-size: 12px; padding: 40px 20px; border: 2px dashed var(--border); border-radius: var(--r); }

  @media (max-width: 768px) {
    body { height: auto; }
    .main { flex-direction: column; overflow: visible; }
    .panel-l, .panel-r { width: 100%; overflow: visible; }
    .panel-r { border-left: none; border-top: 1px solid var(--border); }
    .topbar { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 8px; }
    .topbar h1 { width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-mark">M</div>
  <h1>MakerEdu Beurteilungs-Generator</h1>
  <div style="display:flex;gap:6px">
    <button class="pill" onclick="applyPreset('minimal')">Minimal</button>
    <button class="pill" onclick="applyPreset('standard')">Standard</button>
    <button class="pill" onclick="applyPreset('full')">Alle</button>
  </div>
</div>

<div class="main">
  <div class="panel-l">
    <div class="settings">
      <div class="settings-toggle" onclick="toggleSettings()">
        <span>Dokument-Einstellungen</span>
        <span class="chevron" id="settings-chevron">▼</span>
      </div>
      <div class="settings-body" id="settings-body" style="display:none;">
        <input type="text" id="docTitle" value="CHALLENGE-BEURTEILUNG" placeholder="Titel">
        <input type="text" id="docSubtitle" value="MakerEdu | Selbst- & Fremdeinschätzung" placeholder="Untertitel">
        <input type="text" id="schoolName" value="" placeholder="Schulname (optional)">
        <textarea id="assignmentText" rows="2" placeholder="Auftrag / Aufgabenstellung (optional)"></textarea>
      </div>
    </div>
    <div class="toolbar">
      <span class="toolbar-badge" id="status-badge">0 Indikatoren</span>
      <span style="color:var(--border);font-size:11px">·</span>
      <span class="toolbar-info" id="status-comps">0 Bereiche</span>
      <button class="btn-reset" onclick="resetAll()">Zurücksetzen</button>
    </div>
    <div id="accordions"></div>
  </div>
  <div class="panel-r">
    <div class="right-header">
      <span>Vorschau</span>
      <button class="btn-pdf" id="btn-pdf" disabled onclick="generatePDF()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PDF
      </button>
    </div>
    <div id="preview"></div>
  </div>
</div>

<script>
const DATA = {
  personal: { id:"personal", label:"PERSONALKOMPETENZ", shortLabel:"Dranbleiben", color:"#7C3AED", colorLight:"#F5F0FF", subs: [
    { id:"p1", label:"Eigenständigkeit", inds: ["Du hast dein Produkt selbständig geplant und umgesetzt.","Du hast deine eigene(n) Idee(n) umgesetzt.","Du hattest viele gute Ideen.","Du konntest etwas bauen, das dir wichtig ist.","Du hast etwas gelernt, das dich interessiert."]},
    { id:"p2", label:"Offenheit / Risikobereitschaft", inds: ["Du hast Werkzeuge, Materialien oder Maschinen ausprobiert, die du vorher noch nicht kanntest.","Du hast Ideen umgesetzt, von denen du nicht wusstest, ob sie funktionieren.","Du hast ein Projekt gewählt, das du vorher noch nie umgesetzt hast."]},
    { id:"p3", label:"Selbstregulation / Selbstreflexion", inds: ["Du hast so lange getüftelt, bis das Problem gelöst war.","Wenn etwas nicht funktioniert hat, wolltest du herausfinden, was der Grund dafür ist.","Du hast Fehler als Chance gesehen und etwas daraus gelernt.","Wenn es mal mühsam war, konntest du dich selbst zum Weitermachen motivieren.","Du hast die Zeit sinnvoll eingeteilt.","Du hast dein Ziel im Auge behalten und bis zum Schluss verfolgt.","Du konntest dich auf dein Projekt konzentrieren."]},
    { id:"p4", label:"Flexibilität / Improvisation", inds: ["Wenn etwas gefehlt hat (z.B. Material), hast du etwas anderes verwendet.","Du hast Dinge verwendet, die eigentlich für etwas anderes gedacht sind."]},
    { id:"p5", label:"Verantwortung / Haltung", inds: ["Du bist Schwierigkeiten nicht aus dem Weg gegangen.","Du hast Hilfe gesucht und angenommen, wenn du nicht mehr weiterwusstest.","Du hast deine wichtigsten Erkenntnisse dokumentiert.","Du hast deinen Arbeitsplatz aufgeräumt und sauber hinterlassen.","Du hast die Schutz- und Sicherheitsregeln beachtet."]},
  ]},
  methodical: { id:"methodical", label:"METHODISCHE KOMPETENZ", shortLabel:"Denken & Zeigen", color:"#E8590C", colorLight:"#FFF4ED", subs: [
    { id:"m1", label:"Problemanalyse / Problemverstehen", inds: ["Du hast selbst versucht, das Problem zu verstehen.","Dir war klar, welches Problem zu lösen ist.","Bei Fehlern hast du herausgefunden, was das Problem war.","Du hast Tipps zu deinem Problem im Netz oder anderswo gefunden."]},
    { id:"m2", label:"Kreative Problemlösefähigkeiten", inds: ["Du hattest sehr viele Ideen.","Du hast Methoden zur Ideenentwicklung eingesetzt (z.B. Brainstorming, morphologischer Kasten).","Bei der Fehlersuche bist du systematisch vorgegangen.","Du konntest selbstständig Fehler beheben.","Du konntest Fehler mit Unterstützung anderer beheben."]},
    { id:"m3", label:"Produktentwicklung", inds: ["Du hast Skizzen, Modelle und Prototypen angefertigt, bevor du das Endprodukt gebaut hast.","Du kannst deine Konstruktionsschritte und Gestaltungsentscheidungen begründen.","Du kannst dir für dein Projekt Inspirationen suchen (z.B. im Netz oder von Mitschüler:innen)."]},
    { id:"m4", label:"Recherche- und Informationskompetenzen", inds: ["Du hast im Internet brauchbare Anregungen für dein Produkt gefunden.","Du hast KI-Tools gezielt und mit guten Prompts für die Problemlösung eingesetzt."]},
  ]},
  social: { id:"social", label:"SOZIALE KOMPETENZ", shortLabel:"Zusammenarbeiten", color:"#0F9D58", colorLight:"#EDFCF2", subs: [
    { id:"s1", label:"Zusammenarbeit", inds: ["Du bist respektvoll mit anderen umgegangen.","Du hast dazu beigetragen, dass Meinungsverschiedenheiten gelöst wurden.","Du konntest deine Stärken einbringen.","Du hast dich aktiv an der Zusammenarbeit beteiligt."]},
    { id:"s2", label:"Hilfs- und Unterstützungsbereitschaft", inds: ["Du hast anderen bei ihren Projekten weitergeholfen.","Du konntest anderen etwas beibringen (z.B. wie ein Werkzeug funktioniert).","Du hast dazu beigetragen, dass Ideen anderer umgesetzt werden konnten."]},
    { id:"s3", label:"Feedback einfordern und geben", inds: ["Wenn du nicht weiterwusstest, hast du andere um Unterstützung gebeten.","Du konntest das Feedback anderer für dein Projekt nutzen.","Du konntest dich in die Produkte anderer hineindenken und Verbesserungsvorschläge machen."]},
    { id:"s4", label:"Wertschätzung", inds: ["Du hast andere für eine gute Idee gelobt.","Du hast die Stärken anderer erkannt und gewürdigt."]},
  ]},
  technical: { id:"technical", label:"FACHKOMPETENZ", shortLabel:"Machen", color:"#1A73E8", colorLight:"#EEF4FF", subs: [
    { id:"f1", label:"Werkzeuge & Handwerk", inds: ["Du hast digitale Fabrikationsverfahren für die Herstellung deines Produkts verwendet.","Du weisst, wofür du einen 3D-Drucker / Laser Cutter / Plotter sinnvoll einsetzen kannst.","Du hast neue technische Verfahren kennengelernt."]},
    { id:"f2", label:"Technik", inds: ["Du konntest deine Kenntnisse über Naturwissenschaft und Technik anwenden.","Dein Produkt funktioniert zuverlässig wie geplant.","Dein Produkt zeigt eine eigene kreative Erweiterung über die Vorlage hinaus."]},
    { id:"f3", label:"Informatische Kompetenzen", inds: ["Du konntest Microcontroller, Sensoren und Aktoren zielführend in dein Produkt einbauen.","Du hast Programme geschrieben, in welchen Daten von Sensoren zur Steuerung von Aktoren richtig verwendet werden.","Du konntest Schleifen, Wenn-Dann-Bedingungen, Variablen und andere Programmierbausteine zu lauffähigen Programmen zusammensetzen."]},
    { id:"f4", label:"Medienkompetenzen", inds: ["Du hast Medien zur Dokumentation deiner Arbeit sinnvoll eingesetzt.","Du kannst dein Projekt und das technische Konzept erklären."]},
  ]}
};

const PRESETS = { minimal:{p3:[0,1],m2:[2,3],s3:[0,1],f3:[0,2]}, standard:{p1:[0,1],p3:[0,3,4],m1:[0,2],m3:[0,1],s2:[0,1],s3:[0,1],f3:[0,1,2],f2:[1,2]} };

let selections={}, openComps={}, openSubs={}, customTexts={}, customAdded={}, editingInd=null;

function getIndText(subId,idx,sub){const k=subId+'-'+idx;if(customTexts[k]!==undefined)return customTexts[k];if(idx>=sub.inds.length)return(customAdded[subId]||[])[idx-sub.inds.length]||'';return sub.inds[idx];}
function getAllInds(sub){return[...sub.inds,...(customAdded[sub.id]||[])];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function getActiveComps(){return Object.values(DATA).filter(c=>c.subs.some(s=>(selections[s.id]||[]).length>0));}

function render(){renderAccordions();renderPreview();updateStatus();}
function toggleSettings(){const b=document.getElementById('settings-body'),c=document.getElementById('settings-chevron'),v=b.style.display!=='none';b.style.display=v?'none':'flex';c.classList.toggle('open',!v);}
function updateStatus(){let t=0;Object.values(selections).forEach(a=>t+=a.length);const ac=getActiveComps().length,b=document.getElementById('status-badge');b.textContent=t+' Indikatoren';b.style.background=t>0?'#EDFCF2':'';b.style.color=t>0?'#0F9D58':'';document.getElementById('status-comps').textContent=ac+' Bereiche';document.getElementById('btn-pdf').disabled=t===0;}
function toggleComp(id){openComps[id]=!openComps[id];render();}
function toggleSub(id){openSubs[id]=!openSubs[id];render();}
function toggleInd(subId,idx){const a=selections[subId]||[];if(a.includes(idx))selections[subId]=a.filter(x=>x!==idx);else selections[subId]=[...a,idx];render();}
function toggleAllInds(subId,sel){let sub;Object.values(DATA).forEach(c=>c.subs.forEach(s=>{if(s.id===subId)sub=s;}));selections[subId]=sel?getAllInds(sub).map((_,i)=>i):[];render();}
function startEdit(subId,idx){editingInd=subId+'-'+idx;render();const el=document.getElementById('edit-input-'+subId+'-'+idx);if(el){el.focus();el.select();}}
function cancelEdit(){editingInd=null;render();}
function saveIndEdit(subId,idx,txt){txt=txt.trim();if(!txt){cancelEdit();return;}let sub;Object.values(DATA).forEach(c=>c.subs.forEach(s=>{if(s.id===subId)sub=s;}));if(idx<sub.inds.length){if(txt===sub.inds[idx])delete customTexts[subId+'-'+idx];else customTexts[subId+'-'+idx]=txt;}else{const ai=idx-sub.inds.length;if(!customAdded[subId])customAdded[subId]=[];customAdded[subId][ai]=txt;}editingInd=null;render();}
function addCustomInd(subId){if(!customAdded[subId])customAdded[subId]=[];customAdded[subId].push('Neuer Indikator...');let sub;Object.values(DATA).forEach(c=>c.subs.forEach(s=>{if(s.id===subId)sub=s;}));const ni=sub.inds.length+customAdded[subId].length-1;if(!selections[subId])selections[subId]=[];selections[subId].push(ni);openSubs[subId]=true;editingInd=subId+'-'+ni;render();const el=document.getElementById('edit-input-'+subId+'-'+ni);if(el){el.focus();el.select();}}
function removeCustomInd(subId,idx){let sub;Object.values(DATA).forEach(c=>c.subs.forEach(s=>{if(s.id===subId)sub=s;}));const ai=idx-sub.inds.length;if(!customAdded[subId])return;customAdded[subId].splice(ai,1);const pfx=subId+'-';Object.keys(customTexts).forEach(k=>{if(k.startsWith(pfx)){const ki=parseInt(k.split('-').pop());if(ki===idx)delete customTexts[k];else if(ki>idx){customTexts[pfx+(ki-1)]=customTexts[k];delete customTexts[k];}}});const sl=selections[subId]||[];selections[subId]=sl.filter(i=>i!==idx).map(i=>i>idx?i-1:i);editingInd=null;render();}
function applyPreset(key){if(key==='full'){selections={};Object.values(DATA).forEach(c=>c.subs.forEach(s=>{selections[s.id]=s.inds.map((_,i)=>i);}));}else{selections=JSON.parse(JSON.stringify(PRESETS[key]));}Object.values(DATA).forEach(c=>{openComps[c.id]=c.subs.some(s=>(selections[s.id]||[]).length>0);});render();}
function resetAll(){selections={};render();}
document.addEventListener('input',e=>{if(['docTitle','docSubtitle','schoolName','assignmentText'].includes(e.target.id))renderPreview();});

function renderAccordions(){
  let h='';
  Object.values(DATA).forEach(comp=>{
    const ts=comp.subs.reduce((s,sub)=>s+(selections[sub.id]||[]).length,0), io=openComps[comp.id];
    h+=`<div class="comp-accordion" style="${io?'border-color:'+comp.color+'40':''}">`;
    h+=`<div class="comp-header" onclick="toggleComp('${comp.id}')"><div class="comp-dot" style="background:${comp.color}"></div><div class="comp-label"><strong style="color:${comp.color}">${comp.label}</strong><small>${comp.shortLabel}</small></div><span class="comp-count" style="background:${ts>0?comp.color:'var(--border-lt)'};color:${ts>0?'white':'var(--dim)'}">${ts}</span><span class="chevron ${io?'open':''}">▼</span></div>`;
    if(io){
      h+=`<div class="comp-body">`;
      comp.subs.forEach(sub=>{
        const ai=getAllInds(sub),sl=selections[sub.id]||[],as=sl.length===ai.length&&ai.length>0,ss=sl.length>0,so=openSubs[sub.id];
        h+=`<div style="margin-bottom:4px"><div class="sub-header" style="background:${ss?comp.color+'0A':'transparent'}" onclick="toggleSub('${sub.id}')"><input type="checkbox" ${as?'checked':''} onclick="event.stopPropagation();toggleAllInds('${sub.id}',${!as})" style="accent-color:${comp.color};width:14px;height:14px"><span class="sub-label">${sub.label}</span><span class="sub-count">${sl.length}/${ai.length}</span><span class="chevron ${so?'open':''}">▼</span></div>`;
        if(so){
          h+=`<div class="sub-indicators">`;
          ai.forEach((_,i)=>{
            const it=getIndText(sub.id,i,sub),ck=sl.includes(i),ek=sub.id+'-'+i,ie=editingInd===ek;
            if(ie){
              h+=`<div style="display:flex;gap:4px;align-items:center;margin:2px 0"><input type="checkbox" ${ck?'checked':''} onclick="toggleInd('${sub.id}',${i})" style="accent-color:${comp.color};width:14px;height:14px;flex-shrink:0"><input type="text" id="edit-input-${ek}" value="${it.replace(/"/g,'&quot;')}" style="flex:1;font-size:11px;padding:4px 8px;border:1.5px solid ${comp.color};border-radius:4px;outline:none;font-family:var(--font)" onkeydown="if(event.key==='Enter')saveIndEdit('${sub.id}',${i},this.value);if(event.key==='Escape')cancelEdit()"><button onclick="saveIndEdit('${sub.id}',${i},document.getElementById('edit-input-${ek}').value)" style="padding:3px 8px;background:${comp.color};color:white;border:none;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:11px">✓</button><button onclick="cancelEdit()" style="padding:3px 8px;background:var(--border-lt);border:none;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:11px">✕</button>`;
              if(i>=sub.inds.length)h+=`<button onclick="removeCustomInd('${sub.id}',${i})" style="padding:3px 6px;background:#FEE2E2;color:#DC2626;border:none;border-radius:4px;cursor:pointer;font-size:10px">🗑</button>`;
              h+=`</div>`;
            }else{
              h+=`<div style="display:flex;align-items:center;gap:2px" class="ind-row"><label class="ind-label" style="flex:1"><input type="checkbox" ${ck?'checked':''} onclick="toggleInd('${sub.id}',${i})" style="accent-color:${comp.color}">${it}</label><button onclick="event.stopPropagation();startEdit('${sub.id}',${i})" class="edit-btn" style="font-size:10px;padding:2px 5px;background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--dim);flex-shrink:0;opacity:0;transition:opacity 0.1s" title="Bearbeiten">✎</button>`;
              if(i>=sub.inds.length)h+=`<button onclick="event.stopPropagation();removeCustomInd('${sub.id}',${i})" class="edit-btn" style="font-size:10px;padding:2px 5px;background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:#E53E3E;flex-shrink:0;opacity:0;transition:opacity 0.1s" title="Löschen">✕</button>`;
              h+=`</div>`;
            }
          });
          h+=`<button onclick="addCustomInd('${sub.id}')" style="font-size:10px;padding:4px 8px;margin-top:4px;background:none;color:${comp.color};border:1px dashed ${comp.color}44;border-radius:4px;cursor:pointer;width:100%;text-align:left;font-family:var(--font);transition:background 0.1s" onmouseover="this.style.background='${comp.colorLight}'" onmouseout="this.style.background='none'">+ Eigenen Indikator</button></div>`;
        }
        h+=`</div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  document.getElementById('accordions').innerHTML=h;
  document.querySelectorAll('.ind-row').forEach(r=>{r.addEventListener('mouseenter',()=>r.querySelectorAll('.edit-btn').forEach(b=>b.style.opacity='1'));r.addEventListener('mouseleave',()=>r.querySelectorAll('.edit-btn').forEach(b=>b.style.opacity='0'));});
}
