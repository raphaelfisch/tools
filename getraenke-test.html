<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Test-Tracker 🍹🍟</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d27;--accent:#f59e0b;--accent-light:#fbbf24;--accent-dim:rgba(245,158,11,0.15);--text:#e8e6e3;--text-dim:#8b8a88;--border:#2a2d3a;--success:#22c55e;--danger:#ef4444;--glass:rgba(26,29,39,0.85);--radius:12px;--nav-h:56px}
body.light{--bg:#f5f5f0;--card:#ffffff;--accent:#d97706;--accent-light:#b45309;--accent-dim:rgba(217,119,6,0.1);--text:#1a1a1a;--text-dim:#6b7280;--border:#e5e5e0;--success:#16a34a;--danger:#dc2626;--glass:rgba(255,255,255,0.85)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;height:var(--nav-h);border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(20px);position:sticky;top:0;z-index:1000}
.nav-brand{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:800;color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-tabs{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:10px}
.nav-tab{padding:6px 14px;border:none;background:transparent;color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;border-radius:7px;cursor:pointer;transition:all .2s}
.nav-tab.active{background:var(--accent);color:#fff;font-weight:600}
.nav-tab:hover:not(.active){color:var(--text);background:var(--card)}
.db-status{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--text-dim);padding:4px 8px;background:var(--card);border-radius:16px;border:1px solid var(--border)}
.db-dot{width:6px;height:6px;border-radius:50%;background:var(--danger)}.db-dot.connected{background:var(--success)}
.view{display:none;padding:20px;max-width:900px;margin:0 auto}.view.active{display:block}
#mapView{padding:0;max-width:100%;overflow:hidden}
#map{height:calc(100dvh - var(--nav-h));width:100%}
.leaflet-popup-content-wrapper{background:var(--card)!important;color:var(--text)!important;border-radius:var(--radius)!important;border:1px solid var(--border)!important;box-shadow:0 8px 24px rgba(0,0,0,.2)!important}
.leaflet-popup-tip{background:var(--card)!important}
.leaflet-popup-content{font-family:'DM Sans',sans-serif!important;margin:10px 14px!important}
.popup-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:4px}
.popup-meta{font-size:.78rem;color:var(--text-dim);margin-bottom:6px}
.popup-score{display:inline-block;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;font-weight:700;font-size:.8rem}
.popup-criteria{margin-top:6px;font-size:.72rem;line-height:1.5}
.leaflet-control-layers{background:var(--card)!important;border:1px solid var(--border)!important;border-radius:8px!important;color:var(--text)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;padding:8px 12px!important}
.leaflet-control-layers label{color:var(--text)!important;font-family:'DM Sans',sans-serif!important;font-size:.82rem!important}
.form-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.form-subtitle{color:var(--text-dim);font-size:.85rem;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.field{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.field.span2{grid-column:span 2}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical}
.field select{cursor:pointer}
.loc-buttons{display:flex;gap:6px;margin-bottom:6px}
.loc-btn{padding:7px 12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-size:.82rem;font-family:'DM Sans',sans-serif;transition:all .2s;flex:1;text-align:center}
.loc-btn:hover{border-color:var(--accent);color:var(--accent)}
.loc-btn:disabled{opacity:.5;cursor:wait}
.photo-area{margin-top:6px}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin-top:6px;display:none}.photo-preview.show{display:block}
.photo-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px dashed var(--border);background:var(--bg);color:var(--text-dim);border-radius:6px;cursor:pointer;font-size:.82rem;font-family:'DM Sans',sans-serif;transition:all .2s;width:100%;justify-content:center}
.photo-btn:hover{border-color:var(--accent);color:var(--accent)}
.photo-info{font-size:.72rem;color:var(--text-dim);margin-top:4px}
.photo-remove{font-size:.72rem;color:var(--danger);cursor:pointer;margin-left:8px}
input[type="date"]{position:relative}
input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
body:not(.light) input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1)}
.theme-toggle{background:var(--bg);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.loc-indicator{font-size:.72rem}.loc-indicator.ok{color:var(--success)}.loc-indicator.none{color:var(--text-dim)}
.map-modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(15,17,23,.85);align-items:center;justify-content:center;padding:20px}
.map-modal.open{display:flex}
.map-modal-inner{width:100%;max-width:700px;height:70vh;max-height:500px;border-radius:var(--radius);overflow:hidden;position:relative;border:2px solid var(--accent)}
#pickMap{width:100%;height:100%}
.map-modal-bar{position:absolute;top:0;left:0;right:0;padding:8px 12px;background:var(--glass);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;z-index:2001;border-bottom:1px solid var(--border);gap:8px}
.map-modal-bar span{font-size:.8rem;font-weight:600;color:var(--text);white-space:nowrap}
.map-modal-bar button{padding:5px 12px;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.map-modal-btns{display:flex;gap:6px;flex-shrink:0}
.modal-cancel{background:var(--card);color:var(--text);border:1px solid var(--border)!important}
.modal-confirm{background:var(--accent);color:var(--bg);margin-left:8px}
.map-crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2001;font-size:28px;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.section-label{font-size:.72rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.criteria-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:3px 9px;border-radius:12px;font-size:.76rem;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);user-select:none;line-height:1.3}
.chip.active{background:var(--accent-dim);border-color:rgba(245,158,11,.3);color:var(--accent-light)}
.chip:hover{border-color:var(--accent)}
.add-row{display:flex;gap:6px}
.add-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;font-size:.8rem}
.add-row input:focus{border-color:var(--accent)}
.sliders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.s-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.s-card label{display:block;font-size:.7rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.slider-wrap{display:flex;align-items:center;gap:8px}
.slider-wrap input[type="range"]{flex:1;-webkit-appearance:none;appearance:none;height:5px;background:var(--border);border-radius:3px;border:none;padding:0}
.slider-wrap input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);box-shadow:0 2px 4px rgba(245,158,11,.3)}
.slider-val{min-width:22px;text-align:center;font-weight:700;font-size:.95rem;color:var(--accent)}
.btn-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:10px 24px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-light);transform:translateY(-1px)}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-sm{padding:5px 12px;font-size:.78rem}
.manage-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:20px}
.manage-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.m-tag{display:flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:3px 9px;font-size:.76rem;font-weight:500;color:var(--accent-light)}
.m-tag .x{cursor:pointer;opacity:.6;font-size:.95rem;line-height:1}.m-tag .x:hover{opacity:1;color:var(--danger)}

/* LIST */
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.list-header h2{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:800;color:var(--accent)}
.list-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-controls select,.list-controls input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.82rem}
.list-controls input{width:160px}
.list-controls input::placeholder{color:var(--text-dim)}
.cat-filter{display:flex;gap:4px;margin-bottom:12px}
.cat-btn{padding:4px 12px;border-radius:14px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);transition:all .15s}
.cat-btn.active{background:var(--accent-dim);border-color:rgba(245,158,11,.3);color:var(--accent-light)}
.cat-btn:hover{border-color:var(--accent)}
.e-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.e-card:hover{border-color:var(--accent-dim)}
.e-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.e-info{flex:1;min-width:0}
.e-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-cat{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:8px;background:var(--accent-dim);color:var(--accent-light);font-weight:500;margin-left:6px;vertical-align:middle}
.e-loc{font-size:.78rem;color:var(--text-dim);margin-top:1px}
.e-date{font-size:.72rem;color:var(--text-dim)}
.e-score{background:var(--accent);color:#fff;font-weight:800;font-size:.95rem;padding:4px 12px;border-radius:14px;white-space:nowrap;flex-shrink:0}
.e-ratings{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.e-r{background:var(--bg);border-radius:5px;padding:3px 7px;font-size:.72rem}
.e-r .l{color:var(--text-dim)}.e-r .v{color:var(--accent);font-weight:700;margin-left:2px}
.e-notes{margin-top:6px;font-size:.78rem;color:var(--text-dim);font-style:italic}
.e-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.e-actions button{background:var(--bg);border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:.78rem;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:3px}
.e-actions button:hover{border-color:var(--accent);color:var(--accent)}
.e-actions button.del:hover{border-color:var(--danger);color:var(--danger)}
.e-actions button.share{color:var(--success)}.e-actions button.share:hover{border-color:var(--success)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:2.5rem;margin-bottom:10px}
.empty-state h3{font-family:'Playfair Display',serif;color:var(--text);margin-bottom:6px}

/* RANKING */
.ranking-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.ranking-card .rank-num{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:800;color:var(--accent);margin-right:10px}
.ranking-card .rank-top{display:flex;align-items:center}
.ranking-card .rank-info{flex:1}
.ranking-card .rank-name{font-weight:600;font-size:.95rem}
.ranking-card .rank-loc{font-size:.75rem;color:var(--text-dim)}
.ranking-card .rank-score{font-weight:800;font-size:1rem;color:var(--accent)}

.loading-overlay{position:fixed;inset:0;background:rgba(15,17,23,.7);display:none;align-items:center;justify-content:center;z-index:3000}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:16px;right:16px;background:var(--success);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;font-size:.85rem;transform:translateY(80px);opacity:0;transition:all .3s;z-index:2000}
.toast.error{background:var(--danger)}.toast.show{transform:translateY(0);opacity:1}

@media(max-width:600px){
.nav{flex-direction:column;gap:8px;padding:8px 12px;height:auto}
:root{--nav-h:auto}
#map{height:calc(100dvh - 100px)}
.nav-right{flex-direction:column;gap:6px;width:100%}
.nav-tabs{width:100%;justify-content:center}
.view{padding:14px}
.form-row,.form-row.three{grid-template-columns:1fr}
.field.span2{grid-column:span 1}
.sliders-grid{grid-template-columns:1fr 1fr}
.e-top{flex-direction:column;gap:6px}
.map-modal-inner{height:60vh}
.list-controls input{width:120px}
}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-brand">🍹🍟 Test-Tracker</div>
<div class="nav-right">
<div class="nav-tabs">
<button class="nav-tab active" onclick="switchView('form')">Neuer Test</button>
<button class="nav-tab" onclick="switchView('list')">Alle Tests</button>
<button class="nav-tab" onclick="switchView('ranking')">Ranking</button>
<button class="nav-tab" onclick="switchView('map')">Karte</button>
</div>
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Hell/Dunkel umschalten">🌙</button>
<div class="db-status"><div class="db-dot" id="dbDot"></div><span id="dbStatusText">Datenbank verbindet...</span></div>
</div>
</nav>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<!-- MAP PICKER MODAL -->
<div class="map-modal" id="mapModal">
<div class="map-modal-inner">
<div class="map-modal-bar">
<span>📍 Standort wählen</span>
<div class="map-modal-btns">
<button class="modal-cancel" onclick="closeMapPicker()">Abbrechen</button>
<button class="modal-confirm" onclick="confirmMapPicker()">✓ Übernehmen</button>
</div>
</div>
<div id="pickMap"></div>
<div class="map-crosshair">📍</div>
</div>
</div>

<!-- FORM -->
<div id="formView" class="view active">
<div class="form-title" id="formTitle">Neuer Test</div>
<div class="form-subtitle" id="formSubtitle">Bewerte dein Getränk oder deine Pommes</div>

<div class="form-row three">
<div class="field"><label>Kategorie</label>
<select id="category" onchange="onCategoryChange()"><option value="Getränk">🍹 Getränk</option><option value="Pommes">🍟 Pommes</option></select>
</div>
<div class="field"><label>Name / Produkt</label><input type="text" id="drinkName" placeholder="z.B. Gin Tonic, Pommes"></div>
<div class="field"><label>Ort / Bar</label><input type="text" id="locationName" placeholder="z.B. Bar XY, Zürich"></div>
</div>
<div class="form-row three">
<div class="field"><label>Datum</label><input type="date" id="testDate"></div>
<div class="field"><label>Preis (CHF)</label><input type="number" id="priceChf" placeholder="14.50" step="0.50" min="0"></div>
<div class="field"><label>Webseite (optional)</label><input type="url" id="website" placeholder="https://..."></div>
</div>

<div class="field span2" style="margin-bottom:12px">
<label>Standort</label>
<div class="loc-buttons">
<button class="loc-btn" onclick="useMyLocation()" id="locBtn">📡 GPS-Standort</button>
<button class="loc-btn" onclick="openMapPicker()">🗺️ Auf Karte wählen</button>
</div>
<div class="loc-indicator none" id="locStatus">Kein Standort gesetzt</div>
<input type="hidden" id="coordLat"><input type="hidden" id="coordLng">
</div>

<div class="criteria-bar">
<div class="section-label">Kriterien für diesen Test</div>
<div class="chips" id="criteriaChips"></div>
<div class="add-row">
<input type="text" id="customCritInput" placeholder="Eigenes Kriterium..." onkeydown="if(event.key==='Enter')addCustomCriteria()">
<button class="btn btn-primary btn-sm" onclick="addCustomCriteria()">+</button>
</div>
</div>

<div class="sliders-grid" id="activeSliders"></div>

<div class="field span2" style="margin-bottom:12px">
<label>Foto (optional)</label>
<div class="photo-area">
<label class="photo-btn" id="photoBtn" for="photoInput">📷 Foto hinzufügen</label>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
<img id="photoPreview" class="photo-preview">
<div id="photoInfo" class="photo-info"></div>
</div>
</div>

<div class="field span2" style="margin-bottom:12px"><label>Notizen</label><textarea id="notes" rows="2" placeholder="Bemerkungen..."></textarea></div>

<div class="btn-row">
<button class="btn btn-primary" onclick="saveEntry()">💾 Speichern</button>
<button class="btn btn-secondary" onclick="resetForm()">+ Neuer Eintrag</button>
</div>

<details class="manage-section">
<summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px">
<span style="font-size:.85rem">⚙️</span>
<span style="font-size:.85rem;font-weight:600;color:var(--accent)">Standard-Kriterien anpassen</span>
<span style="font-size:.7rem;color:var(--text-dim);margin-left:4px">— für die gewählte Kategorie</span>
</summary>
<div style="margin-top:12px">
<div class="manage-tags" id="criteriaList"></div>
<div class="add-row">
<input type="text" id="newCriteriaInput" placeholder="Neues Standard-Kriterium..." onkeydown="if(event.key==='Enter')addGlobalCriteria()">
<button class="btn btn-primary btn-sm" onclick="addGlobalCriteria()">+ Hinzufügen</button>
</div>
</div>
</details>
</div>

<!-- LIST -->
<div id="listView" class="view">
<div class="list-header">
<h2>Alle Tests</h2>
<div class="list-controls">
<input type="text" id="searchInput" placeholder="🔍 Suche..." oninput="renderEntries()">
<select id="sortBy" onchange="renderEntries()">
<option value="date-desc">Neueste zuerst</option><option value="date-asc">Älteste zuerst</option>
<option value="score-desc">Bester Score</option><option value="score-asc">Schlechtester Score</option>
<option value="price-asc">Günstigster</option><option value="price-desc">Teuerster</option>
</select>
</div>
</div>
<div class="cat-filter" id="catFilter"></div>
<div id="entriesList"></div>
</div>

<!-- RANKING -->
<div id="rankingView" class="view">
<div class="list-header">
<h2>🏆 Ranking</h2>
<div class="list-controls">
<select id="rankCat" onchange="renderRanking()">
<option value="">Alle Kategorien</option>
<option value="Getränk">🍹 Getränke</option>
<option value="Pommes">🍟 Pommes</option>
</select>
</div>
</div>
<div id="rankingList"></div>
</div>

<!-- MAP -->
<div id="mapView" class="view"><div id="map"></div></div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL='https://gazswoxtcwhbhosuohga.supabase.co';

function updateCriteriaForCategory(){

function onCategoryChange(){
updateCriteriaForCategory();

function renderGlobalCriteria(){
document.getElementById('criteriaList').innerHTML=globalCriteria.map(function(c){
return'<div class="m-tag">'+c+'<span class="x" onclick="removeGlobalCriteria(\''+c.replace(/'/g,"\\'")+'\')">×</span></div>'}).join('')}

async function addGlobalCriteria(){
var input=document.getElementById('newCriteriaInput'),name=input.value.trim();
if(!name)return;
var cat=document.getElementById('category').value;
if(globalCriteria.find(function(c){return c.toLowerCase()===name.toLowerCase()}))return showToast('Existiert bereits!',true);
try{var res=await sb.from('criteria').insert({name:name,sort_order:globalCriteria.length+1,category:cat});if(res.error)throw res.error;
allCriteria.push({name:name,sort_order:globalCriteria.length+1,category:cat});
globalCriteria.push(name);if(activeCriteria.indexOf(name)===-1)activeCriteria.push(name);
input.value='';renderGlobalCriteria();renderCriteriaChips();renderActiveSliders();showToast('"'+name+'" hinzugefügt');
}catch(e){showToast('Fehler: '+e.message,true)}}

async function removeGlobalCriteria(name){
if(!confirm('"'+name+'" löschen?'))return;
var cat=document.getElementById('category').value;
try{var res=await sb.from('criteria').delete().eq('name',name).eq('category',cat);if(res.error)throw res.error;
allCriteria=allCriteria.filter(function(c){return!(c.name===name&&(c.category||'Getränk')===cat)});
globalCriteria=globalCriteria.filter(function(c){return c!==name});

}catch(e){showToast('Fehler: '+e.message,true)}}

// CRITERIA PICKER
function renderCriteriaChips(){
var all=globalCriteria.slice();
activeCriteria.forEach(function(c){if(all.indexOf(c)===-1)all.push(c)});
document.getElementById('criteriaChips').innerHTML=all.map(function(c){
var on=activeCriteria.indexOf(c)!==-1;
return'<div class="chip'+(on?' active':'')+'" onclick="toggleCriteria(\''+c.replace(/'/g,"\\'")+'\')">'+(on?'✓ ':'')+c+'</div>'}).join('')}

function toggleCriteria(name){var i=activeCriteria.indexOf(name);if(i!==-1)activeCriteria.splice(i,1);else activeCriteria.push(name);renderCriteriaChips();renderActiveSliders()}

function addCustomCriteria(){var input=document.getElementById('customCritInput'),name=input.value.trim();
if(!name)return;if(activeCriteria.find(function(c){return c.toLowerCase()===name.toLowerCase()}))return showToast('Bereits vorhanden!',true);

function renderActiveSliders(){

var res=await sb.storage.from('photos').upload(name,file,{contentType:file.type});if(res.error)throw res.error;

function removePhoto(){currentPhotoUrl=null;document.getElementById('photoPreview').classList.remove('show');document.getElementById('photoPreview').src='';document.getElementById('photoInfo').innerHTML='';document.getElementById('photoBtn').textContent='📷 Foto hinzufügen';document.getElementById('photoInput').value=''}

// SHARE
async function shareEntry(id){
var e=entries.find(function(x){return x.id===id});if(!e)return;
showToast('Bild wird erstellt...');
try{
var blob=await generateShareImage(e);
var catIcon=e.category==='Pommes'?'🍟':'🍹';
var text=catIcon+' '+e.name+' @ '+e.location+' — ⌀ '+(e.average||'?')+'/10';

if(navigator.share&&navigator.canShare){
var file=new File([blob],'test-tracker.png',{type:'image/png'});
var shareData={files:[file],title:e.name,text:text};
if(navigator.canShare(shareData)){
await navigator.share(shareData);return}
}
// Fallback: download
var url=URL.createObjectURL(blob);
var a=document.createElement('a');a.href=url;a.download='test-tracker-'+e.name.replace(/\s+/g,'-')+'.png';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
showToast('Bild heruntergeladen!');
}catch(err){if(err.name!=='AbortError')showToast('Teilen fehlgeschlagen',true)}}

function generateShareImage(e){
return new Promise(function(resolve,reject){
var W=1080,H=1350;
var canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
var ctx=canvas.getContext('2d');
var catIcon=(e.category||'Getränk')==='Pommes'?'🍟':'🍹';
var avg=e.average||0;
var r=e.ratings||{};

function drawCard(){
// Background
var grad=ctx.createLinearGradient(0,0,0,H);
grad.addColorStop(0,'#1a1d27');grad.addColorStop(1,'#0f1117');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

var y=0;
// Photo area
if(e.photo_url&&imgLoaded){
var imgH=H*0.5;
ctx.drawImage(img,0,0,W,imgH);
// Gradient overlay on photo
var ov=ctx.createLinearGradient(0,imgH-200,0,imgH);
ov.addColorStop(0,'rgba(15,17,23,0)');ov.addColorStop(1,'rgba(15,17,23,1)');
ctx.fillStyle=ov;ctx.fillRect(0,imgH-200,W,200);
y=imgH-40;
}else{
y=80;
// Decorative top bar
ctx.fillStyle='#f59e0b';ctx.fillRect(0,0,W,6);
}

// Category + Name
y+=50;
ctx.font='bold 36px "DM Sans",sans-serif';ctx.fillStyle='#8b8a88';
ctx.fillText(catIcon+' '+(e.category||'Getränk').toUpperCase(),60,y);

y+=60;
ctx.font='bold 64px "Playfair Display",serif';ctx.fillStyle='#e8e6e3';
var nameLines=wrapText(ctx,e.name,W-120,64);
nameLines.forEach(function(line){ctx.fillText(line,60,y);y+=72});

// Location
y+=10;
ctx.font='500 34px "DM Sans",sans-serif';ctx.fillStyle='#8b8a88';
ctx.fillText('📍 '+e.location,60,y);

// Price + Date
if(e.price||e.test_date){
y+=46;ctx.font='400 28px "DM Sans",sans-serif';ctx.fillStyle='#6b7280';
var meta=[];
if(e.price)meta.push(Number(e.price).toFixed(2)+' CHF');
if(e.test_date)meta.push(formatDate(e.test_date));
ctx.fillText(meta.join(' · '),60,y)}

// Score circle
y+=70;
var scoreX=W/2,scoreR=70;
ctx.beginPath();ctx.arc(scoreX,y,scoreR,0,Math.PI*2);
ctx.fillStyle=avg>=7?'#22c55e':avg>=4?'#f59e0b':'#ef4444';ctx.fill();
ctx.font='bold 52px "DM Sans",sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';
ctx.fillText(avg.toString(),scoreX,y+18);
ctx.font='400 22px "DM Sans",sans-serif';ctx.fillStyle='rgba(255,255,255,0.7)';
ctx.fillText('von 10',scoreX,y+48);
ctx.textAlign='left';

// Ratings
y+=scoreR+50;
var keys=Object.keys(r);
var cols=2;var colW=(W-120)/cols;
keys.forEach(function(k,i){
var col=i%cols;var row=Math.floor(i/cols);
var rx=60+col*colW;var ry=y+row*44;
ctx.font='400 26px "DM Sans",sans-serif';ctx.fillStyle='#8b8a88';
ctx.fillText(k,rx,ry);
ctx.font='bold 26px "DM Sans",sans-serif';ctx.fillStyle='#f59e0b';
ctx.fillText(r[k]+'/10',rx+ctx.measureText(k+'  ').width+10,ry)});

// Notes
if(e.notes){
var notesY=y+Math.ceil(keys.length/cols)*44+20;
ctx.font='italic 26px "DM Sans",sans-serif';ctx.fillStyle='#6b7280';
var noteLines=wrapText(ctx,'"'+e.notes+'"',W-120,26);
noteLines.slice(0,3).forEach(function(line){ctx.fillText(line,60,notesY);notesY+=34})}

// Branding
ctx.font='bold 24px "DM Sans",sans-serif';ctx.fillStyle='#3a3d4a';
ctx.textAlign='center';ctx.fillText('Test-Tracker '+catIcon,W/2,H-30);ctx.textAlign='left';

canvas.toBlob(function(blob){resolve(blob)},'image/png')}

var img=new Image();var imgLoaded=false;
if(e.photo_url){
img.crossOrigin='anonymous';
img.onload=function(){imgLoaded=true;drawCard()};
img.onerror=function(){drawCard()};
img.src=e.photo_url;
}else{drawCard()}})}

function wrapText(ctx,text,maxW,fontSize){
var words=text.split(' ');var lines=[];var line='';
words.forEach(function(w){
var test=line?line+' '+w:w;
if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w}
else{line=test}});
if(line)lines.push(line);return lines}

// CATEGORY FILTER
function renderCatFilter(){
var cats={};entries.forEach(function(e){var c=e.category||'Getränk';cats[c]=(cats[c]||0)+1});
var html='<div class="cat-btn'+(filterCat===''?' active':'')+'" onclick="setFilter(\'\')">Alle ('+entries.length+')</div>';
Object.keys(cats).forEach(function(c){
var icon=c==='Pommes'?'🍟':'🍹';
html+='<div class="cat-btn'+(filterCat===c?' active':'')+'" onclick="setFilter(\''+c+'\')">'+icon+' '+c+' ('+cats[c]+')</div>'});
document.getElementById('catFilter').innerHTML=html}

function setFilter(cat){filterCat=cat;renderCatFilter();renderEntries()}

function getFiltered(){
var list=entries;
if(filterCat)list=list.filter(function(e){return(e.category||'Getränk')===filterCat});
var q=(document.getElementById('searchInput')?document.getElementById('searchInput').value:'').toLowerCase().trim();
if(q)list=list.filter(function(e){return e.name.toLowerCase().indexOf(q)!==-1||e.location.toLowerCase().indexOf(q)!==-1||(e.notes||'').toLowerCase().indexOf(q)!==-1});
return list}

// RENDER LIST
function renderEntries(){
var c=document.getElementById('entriesList');
var s=document.getElementById('sortBy')?document.getElementById('sortBy').value:'date-desc';
var sorted=getFiltered();
switch(s){
case'date-desc':sorted.sort(function(a,b){return(b.test_date||'').localeCompare(a.test_date||'')});break;
case'date-asc':sorted.sort(function(a,b){return(a.test_date||'').localeCompare(b.test_date||'')});break;
case'score-desc':sorted.sort(function(a,b){return(b.average||0)-(a.average||0)});break;
case'score-asc':sorted.sort(function(a,b){return(a.average||0)-(b.average||0)});break;
case'price-asc':sorted.sort(function(a,b){return(a.price||999)-(b.price||999)});break;
case'price-desc':sorted.sort(function(a,b){return(b.price||0)-(a.price||0)});break}
if(!sorted.length){c.innerHTML='<div class="empty-state"><div class="icon">🍹🍟</div><h3>Keine Tests gefunden</h3><p>Erstelle deinen ersten Test oder ändere den Filter.</p></div>';return}
c.innerHTML=sorted.map(function(e){
var r=e.ratings||{};var catIcon=(e.category||'Getränk')==='Pommes'?'🍟':'🍹';
var rh=Object.keys(r).map(function(k){return'<div class="e-r"><span class="l">'+k+':</span><span class="v">'+r[k]+'</span></div>'}).join('');
var web=e.website?'<a href="'+e.website+'" target="_blank" style="color:var(--accent);font-size:.72rem;text-decoration:none">🔗 Webseite</a>':'';
return'<div class="e-card">'+(e.photo_url?'<img src="'+e.photo_url+'" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-bottom:10px">':'')+'<div class="e-top"><div class="e-info"><div class="e-name">'+e.name+'<span class="e-cat">'+catIcon+' '+(e.category||'Getränk')+'</span></div><div class="e-loc">📍 '+e.location+(e.price?' · '+Number(e.price).toFixed(2)+' CHF':'')+'</div><div class="e-date">'+formatDate(e.test_date)+' '+web+'</div></div><div class="e-score">⌀ '+(e.average||'–')+'</div></div><div class="e-ratings">'+rh+'</div>'+(e.notes?'<div class="e-notes">"'+e.notes+'"</div>':'')+'<div class="e-actions"><button onclick="editEntry(\''+e.id+'\')">✏️ Bearbeiten</button><button class="share" onclick="shareEntry(\''+e.id+'\')">📤 Teilen</button><button class="del" onclick="deleteEntry(\''+e.id+'\')">🗑️ Löschen</button></div></div>'}).join('')}

function formatDate(d){if(!d)return'';var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0]}

// RANKING
function renderRanking(){
var cat=document.getElementById('rankCat').value;
var list=entries.slice();
if(cat)list=list.filter(function(e){return(e.category||'Getränk')===cat});
list.sort(function(a,b){return(b.average||0)-(a.average||0)});
var c=document.getElementById('rankingList');
if(!list.length){c.innerHTML='<div class="empty-state"><div class="icon">🏆</div><h3>Noch keine Tests</h3></div>';return}
c.innerHTML=list.map(function(e,i){
var catIcon=(e.category||'Getränk')==='Pommes'?'🍟':'🍹';
var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
return'<div class="ranking-card"><div class="rank-top"><div class="rank-num">'+(medal||'#'+(i+1))+'</div><div class="rank-info"><div class="rank-name">'+catIcon+' '+e.name+'</div><div class="rank-loc">📍 '+e.location+(e.price?' · '+Number(e.price).toFixed(2)+' CHF':'')+'</div></div><div class="rank-score">⌀ '+(e.average||'–')+'</div></div></div>'}).join('')}

// MAIN MAP
function initMap(){
if(map){map.remove();map=null}
map=L.map('map',{center:[46.8,8.2],zoom:8});
var karte=L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',{attribution:'&copy; swisstopo',maxZoom:18});
var luft=L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',{attribution:'&copy; swisstopo',maxZoom:20});
karte.addTo(map);L.control.layers({'Karte':karte,'Luftbild':luft},null,{position:'topright',collapsed:false}).addTo(map);
updateMapMarkers()}

function updateMapMarkers(){
if(!map)return;mapMarkers.forEach(function(m){map.removeLayer(m)});mapMarkers=[];
var geo=entries.filter(function(e){return e.lat&&e.lng});
geo.forEach(function(e){
var avg=e.average||0;var color=avg>=7?'#22c55e':avg>=4?'#f59e0b':'#ef4444';
var catIcon=(e.category||'Getränk')==='Pommes'?'🍟':'🍹';
var icon=L.divIcon({className:'',
html:'<div style="background:'+color+';color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;font-family:DM Sans,sans-serif;border:3px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.3)">'+avg+'</div>',
iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-19]});
var r=e.ratings||{};
var rh=Object.keys(r).map(function(k){return'<span style="color:#8b8a88">'+k+':</span> <b>'+r[k]+'</b>'}).join(' · ');
var popup=(e.photo_url?'<img src="'+e.photo_url+'" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px">':'')+'<div class="popup-title">'+catIcon+' '+e.name+'</div><div class="popup-meta">📍 '+e.location+(e.price?' · '+Number(e.price).toFixed(2)+' CHF':'')+'<br>'+formatDate(e.test_date)+'</div><div class="popup-score">⌀ '+avg+' / 10</div><div class="popup-criteria">'+rh+'</div>'+(e.notes?'<div style="margin-top:5px;font-size:.72rem;color:#8b8a88;font-style:italic">"'+e.notes+'"</div>':'')+(e.website?'<div style="margin-top:6px"><a href="'+e.website+'" target="_blank" style="color:#f59e0b;font-size:.75rem">🔗 Webseite</a></div>':'')+'<div style="margin-top:8px;padding-top:6px;border-top:1px solid #2a2d3a"><a href="#" onclick="editEntry(\''+e.id+'\');return false" style="color:#f59e0b;font-size:.78rem;text-decoration:none">✏️ Bearbeiten</a></div>';
mapMarkers.push(L.marker([e.lat,e.lng],{icon:icon}).addTo(map).bindPopup(popup))});
if(geo.length)map.fitBounds(L.featureGroup(mapMarkers).getBounds().pad(0.15))}

var savedState='';

function getFormState(){
return document.getElementById('drinkName').value.trim()+'|'+document.getElementById('locationName').value.trim()+'|'+document.getElementById('category').value+'|'+document.getElementById('priceChf').value+'|'+document.getElementById('website').value+'|'+document.getElementById('notes').value.trim()+'|'+activeCriteria.join(',')}

function markSaved(){savedState=getFormState()}

function hasUnsavedChanges(){
var current=getFormState();
if(current==='||Getränk||||')return false;
return current!==savedState}

function switchView(v){
if(v!=='form'&&hasUnsavedChanges()){if(!confirm('Du hast ungespeicherte Änderungen. Trotzdem wechseln?'))return}
document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active')});
document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});
var idx={form:0,list:1,ranking:2,map:3};
document.getElementById(v+'View').classList.add('active');
document.querySelectorAll('.nav-tab')[idx[v]].classList.add('active');
if(v==='list')renderEntries();if(v==='ranking')renderRanking();if(v==='map')setTimeout(function(){initMap()},100);
try{localStorage.setItem('gt_view',v)}catch(e){}}

function showLoading(s){document.getElementById('loading').classList.toggle('show',s)}
function showToast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.classList.toggle('error',!!err);t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}

function toggleTheme(){
document.body.classList.toggle('light');
var isLight=document.body.classList.contains('light');
document.getElementById('themeBtn').textContent=isLight?'☀️':'🌙';
try{localStorage.setItem('gt_theme',isLight?'light':'dark')}catch(e){}}

function loadTheme(){
try{var t=localStorage.getItem('gt_theme');if(t==='light'){document.body.classList.add('light');document.getElementById('themeBtn').textContent='☀️'}}catch(e){}}

document.getElementById('testDate').value=new Date().toISOString().split('T')[0];
loadTheme();markSaved();
window.addEventListener('beforeunload',function(e){if(hasUnsavedChanges()){e.preventDefault();e.returnValue=''}});
init();
</script>
</body>
</html>
